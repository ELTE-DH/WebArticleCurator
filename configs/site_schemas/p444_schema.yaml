"site_name": "p444"

"columns":
    "main-column":
        # The next pages of the archive and of the live articles are cursor-based (?after=CURSOR, see the extractors).
        # The portal answers 429 for minutes if these URLs are requested in quick succession (e.g. with --archive
        #  or at long live articles): 1 request / 2 sec failed after 11 pages, 1 request / 5 sec was fine (2026-10).
        #  Use --max-no-of-calls-in-period 1 --limit-period 5 to be safe!
        "archive_url_format": "https://444.hu/#year/#month/#day/"

        "date_first_article": 2013-04-10
        # "date_last_article":  2100-01-01

        "min_pagenum": 0
        # "max_pagenum": NULL

"portal_specific_exctractor_functions_file": "../extractors/site_specific_extractor_functions.py"
"extract_next_page_url_fun": "extract_next_page_url_p444"
"extract_article_urls_from_page_fun": "extract_article_urls_from_page_p444"
"next_page_of_article_fun": "next_page_of_article_p444"

"next_url_by_pagenum": true
"infinite_scrolling": false
"archive_page_urls_by_date": true
"go_reverse_in_archive": true
"verify_request": true
"ignore_archive_cache": false

# "new_article_url_threshold": 0

"corpus_converter_file": "../extractors/corpus_converters.py"
"corpus_converter": "MultiPageArticleConverter"
